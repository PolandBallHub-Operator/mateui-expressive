<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matecha Expressive Web — Components</title>
<style>
:root{--bg:var(--md-sys-color-surface,#141218);--fg:var(--md-sys-color-on-surface,#e6e0e9);--fgv:var(--md-sys-color-on-surface-variant,#cac4d0);--ol:var(--md-sys-color-outline-variant,#49454f);--sc:var(--md-sys-color-surface-container,#211f26);--sch:var(--md-sys-color-surface-container-high,#2b2930);--scl:var(--md-sys-color-surface-container-low,#1d1b20);--pr:var(--md-sys-color-primary,#d0bcff);--onpr:var(--md-sys-color-on-primary,#381e72);--prc:var(--md-sys-color-primary-container,#4f378b);--oprc:var(--md-sys-color-on-primary-container,#eaddff);--sec:var(--md-sys-color-secondary-container,#4a4458);--osec:var(--md-sys-color-on-secondary-container,#e8def8);--font:var(--md-ref-typeface-plain,Inter,system-ui,sans-serif);--dw:304px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);scroll-behavior:smooth}
a{color:var(--pr)}
header.top{position:sticky;top:0;z-index:30;height:64px;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--bg)}
header.top .logo{display:flex;align-items:center;gap:10px;color:var(--fg);text-decoration:none;font-weight:600;font-size:18px;margin-right:auto;padding:6px 8px;border-radius:20px}
header.top .logo span{font-size:26px}
md-navigation-drawer .grp{padding:16px 28px 6px;font-size:13px;color:var(--fgv)}
md-navigation-drawer .filter{margin:4px 16px 8px;width:calc(100% - 32px)}
md-navigation-drawer .opts{display:flex;flex-direction:column;gap:10px;align-items:flex-start;padding:16px 20px 24px}
md-navigation-drawer .opts input[type=color]{width:40px;height:40px;border:0;padding:0;background:none;cursor:pointer;border-radius:50%}
.wrap{min-height:calc(100vh - 64px)}
.page{max-width:1040px;margin:0 auto;padding:16px 16px 96px}
.hero{background:var(--scl);border-radius:36px;padding:clamp(24px,5vw,64px);margin-bottom:16px}
.hero h1{font-size:clamp(44px,11vw,104px);font-weight:400;letter-spacing:-.025em;line-height:1.02;margin:0 0 24px}
.hero p.lead{font-size:clamp(18px,2.6vw,26px);line-height:1.5;color:var(--fgv);max-width:760px;margin:0 0 32px}
.hero md-filled-button{--md-filled-button-container-height:64px;font-size:20px}
.collage{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;border-radius:36px;background:var(--prc);padding:20px;margin-bottom:56px}
.collage>div{background:var(--bg);border-radius:24px;min-height:150px;display:grid;place-items:center;padding:12px;gap:10px;overflow:hidden}
h2.big{font-size:clamp(34px,6vw,56px);font-weight:400;letter-spacing:-.02em;line-height:1.1;margin:56px 0 20px}
.prose p{font-size:17px;line-height:1.7;color:var(--fgv);max-width:760px}
.prose strong{color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{display:block;border-radius:32px;overflow:hidden;background:var(--sec);color:var(--osec);text-decoration:none;transition:border-radius .32s cubic-bezier(.2,0,0,1),transform .2s}
.card:active{border-radius:16px;transform:scale(.99)}
.card .pv{background:var(--oprc);color:var(--prc);min-height:190px;display:grid;place-items:center;padding:16px;pointer-events:none;border-radius:32px 32px 0 0}
.card .tx{padding:20px 24px 24px}
.card h3{margin:0 0 8px;font-size:24px;font-weight:500}
.card p{margin:0;color:var(--osec);opacity:.85;line-height:1.5;font-size:14px}
.chipcard{display:flex;align-items:center;gap:14px;padding:18px 22px;border-radius:24px;background:var(--sc);color:var(--fg);text-decoration:none;font-size:16px;transition:border-radius .32s cubic-bezier(.2,0,0,1),background .2s}
.chipcard:hover{background:var(--sch)}.chipcard:active{border-radius:10px}
.chipcard small{display:block;color:var(--fgv);font-size:12px}
pre.code{margin:0;background:var(--scl);border:1px solid var(--ol);border-radius:20px;padding:18px 20px;overflow:auto;font:13px/1.6 ui-monospace,Menlo,Consolas,monospace;color:var(--fg);position:relative}
.copyrow{position:relative}.copyrow md-filled-tonal-button{position:absolute;top:10px;right:10px}
.note{display:flex;gap:14px;align-items:flex-start;background:var(--sec);color:var(--osec);border-radius:24px;padding:18px 22px;margin:20px 0;line-height:1.55}
.note md-icon{flex:none}
.stats{display:flex;flex-wrap:wrap;gap:12px;margin:8px 0 0}
.stats div{background:var(--sc);border-radius:24px;padding:16px 24px;min-width:140px}
.stats b{display:block;font-size:34px;font-weight:500;color:var(--pr)}
.stats span{font-size:13px;color:var(--fgv)}
.crumb{font-size:14px;color:var(--fgv);margin:8px 8px 0}
.ph{background:var(--scl);border-radius:36px;padding:clamp(24px,5vw,48px);margin:8px 0 16px}
.ph h1{font-size:clamp(40px,9vw,80px);font-weight:400;letter-spacing:-.02em;margin:0 0 12px;line-height:1.05}
.ph p{margin:0;font-size:19px;line-height:1.55;color:var(--fgv);max-width:720px}
.ph code,.api code{font-size:.9em;background:var(--sch);padding:2px 8px;border-radius:8px}
.demo{margin:0 0 20px}
.demo h3{font-size:20px;font-weight:500;margin:28px 8px 12px}
.stage{background:var(--sc);border-radius:28px;padding:32px 24px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center;position:relative}
.stage.col{flex-direction:column;align-items:stretch;justify-content:flex-start}
.stage.tall{min-height:280px;align-items:flex-start}
.demo details{margin-top:8px}
.demo summary{cursor:pointer;padding:8px 12px;font-size:14px;color:var(--fgv)}
.demo pre{margin:6px 0 0;background:var(--scl);border-radius:20px;padding:16px 18px;overflow:auto;max-height:340px;font:12px/1.6 ui-monospace,Menlo,Consolas,monospace;color:var(--fg)}
.api{margin:24px 8px;color:var(--fgv);line-height:1.7;font-size:15px}
.api h3{color:var(--fg);font-size:20px;font-weight:500;margin:0 0 8px}
.sw{width:100%}
footer{margin:72px 8px 0;color:var(--fgv);font-size:13px;line-height:1.7}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
<script type="module" src="https://cdn.jsdelivr.net/gh/PolandBallHub-Operator/mateui-expressive@main/matecha-3.5.0-all.js"></script>
</head>
<body>
<header class="top">
  <md-icon-button id="menu" aria-label="Menu"><md-icon>menu</md-icon></md-icon-button>
  <a class="logo" href="#/"><span>🧉</span>Matecha</a>
  <md-icon-button id="srch" aria-label="Search"><md-icon>search</md-icon></md-icon-button>
</header>
<md-navigation-drawer id="drawer" modal aria-label="Main menu">
  <md-navigation-drawer-header>Main menu</md-navigation-drawer-header>
  <md-outlined-text-field class="filter" id="filter" label="Filter components"></md-outlined-text-field>
  <md-navigation-drawer-divider id="dend"></md-navigation-drawer-divider>
  <div class="opts">
    <md-outlined-button id="dark"><md-icon slot="icon">light_mode</md-icon>Switch to light mode</md-outlined-button>
    <label style="display:flex;align-items:center;gap:12px;font-size:14px;color:var(--fgv)"><input type="color" id="seed" value="#6750a4">Seed color</label>
  </div>
</md-navigation-drawer>
<div class="wrap"><div class="page" id="page"></div></div>

<script>
const URL_JS='https://cdn.jsdelivr.net/gh/PolandBallHub-Operator/mateui-expressive@main/matecha-3.5.0-all.js';
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const btn=(l,x='filled')=>`<md-${x}-button>${l}</md-${x}-button>`;
/* id, name, group, description, demos [title, html, layout], api */
const C=[
['app-bars','App bars','Containment','Top app bars in small, center-aligned, medium and large sizes, with a built-in circled back button.',[
 ['Small and center-aligned',`<md-top-app-bar style="width:100%" headline="Small"><md-icon-button slot="leading"><md-icon>menu</md-icon></md-icon-button></md-top-app-bar><md-top-app-bar style="width:100%" variant="center-aligned" headline="Center"></md-top-app-bar>`,'col'],

['avatars','Avatars','Containment','Avatars with initials or icons and tone variants.',[['Tones',`<md-avatar>AB</md-avatar><md-avatar tone="tertiary">CD</md-avatar><md-avatar tone="secondary"><md-icon>person</md-icon></md-avatar>`]]],
['badges','Badges','Communication','Small status badges, with or without a value.',[['Badge',`<md-badge value="3"></md-badge><md-badge value="99+"></md-badge><md-badge></md-badge>`]]],
['buttons','Buttons','Actions','Five button types, with icons, square shape and full-width block. Shapes morph on press.',[
 ['Types',btn('Elevated','elevated')+btn('Filled')+btn('Tonal','filled-tonal')+btn('Outlined','outlined')+btn('Text','text')],
 ['Icon and disabled',`<md-filled-button><md-icon slot="icon">add</md-icon>Add</md-filled-button><md-outlined-button disabled>Disabled</md-outlined-button>`],
 ['shape="square"',`<md-filled-button shape="square">Square</md-filled-button><md-filled-tonal-button shape="square">Square</md-filled-tonal-button><md-outlined-button shape="square">Square</md-outlined-button>`],

 '<code>block</code> makes a button full width and 48 px high (<code>--md-block-button-height</code>). It is set automatically inside a <code>stacked</code> dialog.'],

['split-button','Split button','Actions','A main action plus a chevron that toggles a slotted menu.',[['Split button',`<md-split-button><md-menu slot="menu"><md-menu-item><div slot="headline">Save as draft</div></md-menu-item><md-menu-item><div slot="headline">Schedule</div></md-menu-item></md-menu>Publish</md-split-button>`,'tall']]],
['segmented-buttons','Segmented buttons','Selection','Single or multi choice in a segmented set. md-outlined-* aliases exist.',[['Set',`<md-segmented-button-set><md-segmented-button selected label="Map"></md-segmented-button><md-segmented-button label="List"></md-segmented-button><md-segmented-button label="Grid"></md-segmented-button></md-segmented-button-set>`]]],
['icon-buttons','Icon buttons','Actions','Standard, filled, tonal and outlined icon buttons, plus toggle.',[['Variants',`<md-icon-button><md-icon>favorite</md-icon></md-icon-button><md-filled-icon-button><md-icon>favorite</md-icon></md-filled-icon-button><md-filled-tonal-icon-button><md-icon>favorite</md-icon></md-filled-tonal-icon-button><md-outlined-icon-button><md-icon>favorite</md-icon></md-outlined-icon-button><md-icon-button toggle><md-icon>star</md-icon><md-icon slot="selected">star</md-icon></md-icon-button>`]]],

['fab-menu','FAB menu','Actions','A FAB that expands into staggered action pills.',[['FAB menu',`<md-fab-menu><md-fab-menu-item label="Photo"><md-icon slot="icon">image</md-icon></md-fab-menu-item><md-fab-menu-item label="Note"><md-icon slot="icon">note</md-icon></md-fab-menu-item></md-fab-menu>`,'tall']]],
['cards','Cards','Containment','Filled, elevated, outlined and tonal cards, optionally interactive.',[['Variants',`<md-card variant="filled" style="padding:16px;width:180px">Filled</md-card><md-card variant="elevated" style="padding:16px;width:180px">Elevated</md-card><md-card variant="outlined" style="padding:16px;width:180px">Outlined</md-card><md-card variant="tonal" interactive style="padding:16px;width:180px">Tonal, interactive</md-card>`]]],

['chips','Chips','Selection','Assist, filter, input and suggestion chips in a chip set.',[['Chip set',`<md-chip-set><md-assist-chip label="Assist"><md-icon slot="icon">event</md-icon></md-assist-chip><md-filter-chip label="Filter" selected></md-filter-chip><md-filter-chip label="Filter"></md-filter-chip><md-input-chip label="Input" removable></md-input-chip><md-suggestion-chip label="Suggestion"></md-suggestion-chip></md-chip-set>`]]],

 ['Stacked (3.5.0)',`<md-outlined-button onclick="dl3.show()">Open stacked</md-outlined-button><md-dialog id="dl3" stacked><div slot="headline">Stacked</div><div slot="content">Vertical full-width actions.</div><div slot="actions"><md-filled-button onclick="dl3.close()">Confirm</md-filled-button><md-text-button onclick="dl3.close()">Cancel</md-text-button></div></md-dialog>`]],

 ['Grouped',`<md-list style="width:100%"><md-list-item><md-icon slot="start">person</md-icon><div slot="headline">Contacts</div><div slot="supporting-text">12 people</div></md-list-item><md-list-item><md-icon slot="start">folder</md-icon><div slot="headline">Files</div><div slot="supporting-text">340 items</div></md-list-item><md-list-item type="button"><md-icon slot="start">settings</md-icon><div slot="headline">Settings</div><md-icon slot="end">chevron_right</md-icon></md-list-item></md-list>`,'col'],

['navigation-drawer','Navigation drawer','Navigation','Modal or standard drawer with header, items and dividers.',[['Drawer',`<md-filled-tonal-button onclick="drw.open=!drw.open">Toggle drawer</md-filled-tonal-button><md-navigation-drawer id="drw"><md-navigation-drawer-header>Matecha</md-navigation-drawer-header><md-navigation-drawer-item label="Inbox" active><md-icon slot="icon">inbox</md-icon></md-navigation-drawer-item><md-navigation-drawer-divider></md-navigation-drawer-divider><md-navigation-drawer-item label="Sent"><md-icon slot="icon">send</md-icon></md-navigation-drawer-item></md-navigation-drawer>`]]],

['radio','Radio','Selection','Radio buttons grouped by name.',[['Radio group',`<label><md-radio name="r" value="a" checked></md-radio> A</label><label><md-radio name="r" value="b"></md-radio> B</label><label><md-radio name="r" value="c"></md-radio> C</label>`]]],

 ['Search view',`<md-search-bar id="sb2" placeholder="Click to open search" style="width:320px"></md-search-bar><md-search-view anchor="sb2"><md-icon slot="leading-icon">search</md-icon><md-list flat><md-list-item><div slot="headline">Recent: Matecha</div></md-list-item><md-list-item><div slot="headline">Recent: Compose</div></md-list-item></md-list></md-search-view>`,'tall']],
 '<code>md-search-view</code> opens when its <code>anchor</code> is clicked or focused. Events: <code>open</code>, <code>opened</code>, <code>close</code>, <code>closed</code>, <code>input</code>, <code>search</code>, <code>clear</code>. Escape closes.'],

['sliders','Sliders','Selection','Thick track, detached handle. Sizes, vertical and icon were added in 3.5.0.',[
 ['Basic, range, ticks',`<md-slider labeled value="40" class="sw"></md-slider><md-slider labeled range value-start="20" value-end="70" class="sw"></md-slider><md-slider ticks step="10" value="50" class="sw"></md-slider>`,'col'],
 ['Sizes xs to xl',`<md-slider size="xs" value="40" class="sw"></md-slider><md-slider size="s" value="50" class="sw"></md-slider><md-slider size="m" value="60" class="sw"></md-slider><md-slider size="l" value="70" class="sw"><md-icon slot="icon">volume_up</md-icon></md-slider><md-slider size="xl" value="80" class="sw"><md-icon slot="icon">brightness_6</md-icon></md-slider>`,'col'],
 ['Vertical and icon position',`<md-slider vertical size="m" value="60"><md-icon slot="icon">volume_up</md-icon></md-slider><md-slider size="l" icon-position="start" value="30" style="width:260px"><md-icon slot="icon">light_mode</md-icon></md-slider>`]],
 '<code>size</code>: xs 16 · s 24 · m 40 · l 56 · xl 96 px. <code>track-height</code> overrides it. Tokens: <code>--md-slider-track-height</code>, <code>-icon-color</code>, <code>-active-icon-color</code>.'],
['snackbar','Snackbar','Communication','Transient messages with a queue and a promise result.',[['MateCha.toast()',`<md-filled-button onclick="MateCha.toast('Saved',{action:'Undo',closeButton:true}).then(r=>console.log(r))">Show snackbar</md-filled-button>`]],'The promise resolves to <code>action</code>, <code>dismiss</code>, <code>timeout</code> or <code>replaced</code>.'],
['swipe','Swipe to reveal','Actions','A row that reveals capsule actions on swipe.',[['Swipe item',`<md-swipe-item style="width:100%"><div style="padding:18px">Swipe left</div><md-swipe-action slot="end" label="Delete"><md-icon slot="icon">delete</md-icon></md-swipe-action><md-swipe-action slot="end" label="Archive"><md-icon slot="icon">archive</md-icon></md-swipe-action></md-swipe-item>`,'col']]],
['switch','Switch','Selection','A 52×32 pill with a spring thumb.',[['Switches',`<md-switch selected></md-switch><md-switch></md-switch><md-switch icons selected></md-switch><md-switch disabled></md-switch>`]]],
['switch-bar','Switch bar','Selection','A full-width main-switch pill; the whole bar toggles. New in 3.5.0.',[['Switch bar',`<md-switch-bar label="Use Live Caption" selected style="width:100%"><span slot="supporting-text">Captions appear automatically</span></md-switch-bar><md-switch-bar label="Dark mode" style="width:100%"></md-switch-bar>`,'col']],
 'Form-associated. Attributes: <code>selected</code>, <code>disabled</code>, <code>required</code>, <code>label</code>, <code>name</code>, <code>value</code> (default “on”). Events: <code>input</code>, <code>change</code>. Tokens: <code>--md-switch-bar-container-height</code>, <code>-container-shape</code>, <code>-selected-container-color</code> and more.'],
['tabs','Tabs','Navigation','Primary and secondary tabs.',[['Primary',`<md-tabs style="width:100%"><md-primary-tab>Video</md-primary-tab><md-primary-tab>Photos</md-primary-tab><md-primary-tab>Music</md-primary-tab></md-tabs>`,'col'],['Secondary',`<md-tabs style="width:100%"><md-secondary-tab>Overview</md-secondary-tab><md-secondary-tab>Specs</md-secondary-tab><md-secondary-tab>Reviews</md-secondary-tab></md-tabs>`,'col']]],
['text-fields','Text fields','Text inputs','Filled and outlined text fields, plus the low-level field elements.',[
 ['Filled',`<md-filled-text-field label="Name" value="Matecha"></md-filled-text-field><md-filled-text-field label="Email" type="email" error error-text="Invalid" value="x"></md-filled-text-field><md-filled-text-field label="Bio" type="textarea" rows="3"></md-filled-text-field>`],
 ['Outlined',`<md-outlined-text-field label="Name" value="Matecha"><md-icon slot="leading-icon">person</md-icon></md-outlined-text-field><md-outlined-text-field label="Limit" supporting-text="Max 10" maxlength="10"></md-outlined-text-field><md-outlined-text-field label="Disabled" disabled></md-outlined-text-field>`],
 ['Fields',`<md-filled-field label="Field" populated style="width:220px"><span>Content</span></md-filled-field><md-outlined-field label="Field" populated style="width:220px"><span>Content</span></md-outlined-field>`]]],
['toolbars','Toolbars','Containment','Floating or standard pill toolbar with an optional fab slot.',[['Toolbar',`<md-toolbar><md-icon-button><md-icon>format_bold</md-icon></md-icon-button><md-icon-button><md-icon>format_italic</md-icon></md-icon-button><md-icon-button><md-icon>format_underlined</md-icon></md-icon-button></md-toolbar>`]]],
['tooltips','Tooltips','Communication','Plain and rich tooltips.',[['Tooltip',`<md-icon-button id="tt"><md-icon>info</md-icon></md-icon-button><md-tooltip anchor="tt">Plain tooltip</md-tooltip>`]]],
['top-popup','Top popup','Communication','A card that slides down from the top edge. Swipe up to dismiss. New in 3.5.0.',[['Top popup',`<md-filled-tonal-button onclick="tp.show()">Show top popup</md-filled-tonal-button><md-top-popup id="tp" duration="5000"><md-icon slot="icon">fullscreen</md-icon><div slot="headline">Viewing full screen</div>Swipe up to exit.<div slot="actions"><md-text-button dialog-action="ok">Got it</md-text-button></div></md-top-popup>`]],
 'Attributes: <code>open</code>, <code>modal</code>, <code>quick</code>, <code>no-swipe-dismiss</code>, <code>duration</code> (0 = no auto-dismiss), <code>return-value</code>. Methods: <code>show()</code>, <code>close()</code>, <code>toggle()</code>. Events: <code>open</code>, <code>opened</code>, <code>close</code>, <code>closed</code>, cancelable <code>cancel</code>.'],
['foundations','Ripple, focus ring, elevation','Foundations','The primitives every component is built from.',[
 ['Elevation and ripple',`<div style="position:relative;width:160px;height:96px;border-radius:16px;background:var(--scl);display:grid;place-items:center;--md-elevation-level:3"><md-elevation></md-elevation><md-ripple></md-ripple>Press me</div>`],
 ['Focus ring',`<button style="position:relative;padding:10px 18px;border-radius:12px;border:1px solid var(--ol);background:none;color:var(--fg);font:inherit">Reach with Tab<md-focus-ring></md-focus-ring></button>`]]]
];
const G=['Actions','Communication','Containment','Navigation','Selection','Text inputs','Foundations'];
const byId=Object.fromEntries(C.map(c=>[c[0],c]));
const $=s=>document.querySelector(s),page=$('#page'),nav=$('#nav');

/* drawer (md-navigation-drawer) */
const drawer=$('#drawer');
const ICON={Actions:'touch_app',Communication:'chat',Containment:'view_agenda',Navigation:'navigation',Selection:'checklist','Text inputs':'edit_note',Foundations:'widgets'};
const item=(id,label,icon)=>`<md-navigation-drawer-item class="dyn" data-id="${id}" label="${label}"><md-icon slot="icon">${icon}</md-icon></md-navigation-drawer-item>`;
function buildNav(f=''){
 f=f.toLowerCase();
 drawer.querySelectorAll('.dyn').forEach(n=>n.remove());
 let h=item('','Home','home')+item('components','Components overview','apps');
 for(const g of G){const it=C.filter(c=>c[2]===g&&(!f||c[1].toLowerCase().includes(f)||c[0].includes(f)));if(!it.length)continue;
  h+=`<div class="grp dyn">${g}</div>`+it.map(c=>item(c[0],c[1],ICON[g])).join('')}
 $('#dend').insertAdjacentHTML('beforebegin',h);mark()}
function mark(){const id=cur();drawer.querySelectorAll('md-navigation-drawer-item').forEach(a=>a.toggleAttribute('active',a.dataset.id===id))}
const cur=()=>location.hash.replace(/^#\/?/,'');
const toggle=o=>{drawer.open=o===undefined?!drawer.open:o;drawer.toggleAttribute('open',drawer.open)};
$('#menu').onclick=()=>toggle();
$('#srch').onclick=()=>{toggle(true);setTimeout(()=>$('#filter').focus(),120)};
$('#filter').addEventListener('input',e=>buildNav(e.target.value));
drawer.addEventListener('click',e=>{const it=e.target.closest('md-navigation-drawer-item');if(it){location.hash='#/'+it.dataset.id;toggle(false)}});

/* pages */
const demoHtml=(d,i)=>`<div class="demo"><h3>${d[0]}</h3><div class="stage ${d[2]||''}">${d[1]}</div><details><summary>View code</summary><pre>${esc(d[1])}</pre></details></div>`;
function pageComponent(c){
 return `<div class="crumb"><a href="#/components">Components</a> / ${c[2]}</div><div class="ph"><h1>${c[1]}</h1><p>${c[3]}</p><p style="margin-top:14px"><code>${c[0]==='foundations'?'md-ripple · md-focus-ring · md-elevation':'&lt;md-'+c[0].replace(/s$/,'')+'&gt;'}</code></p></div>`+c[4].map(demoHtml).join('')+(c[5]?`<div class="api"><h3>API notes</h3>${c[5]}</div>`:'');
}
const card=(id,pv)=>{const c=byId[id];return `<a class="card" href="#/${id}"><div class="pv">${pv}</div><div class="tx"><h3>${c[1]}</h3><p>${c[3]}</p></div></a>`};
function pageHome(){
 return `<section class="hero"><h1>Matecha</h1><p class="lead">Matecha is a from-scratch, drop-in replacement for Google’s Material Web Components. It brings Jetpack Compose Material 3 and Material 3 Expressive to the web as plain Web Components.</p><md-filled-button id="gs">Get started</md-filled-button></section>
 <div class="collage" aria-hidden="true"><div><md-toolbar><md-icon-button><md-icon>format_bold</md-icon></md-icon-button><md-icon-button><md-icon>format_italic</md-icon></md-icon-button></md-toolbar></div><div><md-switch-bar label="Live Caption" selected></md-switch-bar></div><div><md-loading-indicator></md-loading-indicator><md-linear-progress wavy thick value="0.6" style="width:100%"></md-linear-progress></div><div><md-fab label="Compose"><md-icon slot="icon">edit</md-icon></md-fab></div><div><md-connected-button-group><md-connected-button selected>Day</md-connected-button><md-connected-button>Week</md-connected-button></md-connected-button-group></div></div>
 <h2 class="big">What is Matecha?</h2>
 <div class="prose"><p><strong>Matecha</strong> (component name <strong>MateCha</strong>) is an independent implementation that is API-compatible with Material Web Components v2.5.0: the same tag names, attributes, properties, methods, events, slots, parts and <code>--md-sys-*</code> design tokens.</p><p>It was written from scratch as dependency-free Web Components, with no Lit, no tslib and no Google source code. Visuals and motion follow Material 3 Expressive: spring motion, shape morphing on press, wavy progress and a detached-handle slider.</p><p>If your site already uses <code>@material/web</code>, swap the import and your markup keeps working. Matecha is not an official Google product and is not affiliated with Google LLC.</p></div>
 <div class="stats"><div><b>44</b><span>Material Web elements</span></div><div><b>25+</b><span>Expressive additions</span></div><div><b>0</b><span>Dependencies</span></div><div><b>3.5.0</b><span>Latest version</span></div></div>
 <h2 class="big" id="usage">Usage</h2>
 <div class="prose"><p>Add one script tag. Loading the module registers every element and defines <code>window.MateCha</code>.</p></div>
 <div class="copyrow"><pre class="code" id="u1">${esc(`<script type="module" src="${URL_JS}"><\/script>`)}</pre><md-filled-tonal-button data-copy="u1">Copy</md-filled-tonal-button></div>
 <div class="prose"><p>Then use the components like any HTML element.</p></div>
 <pre class="code">${esc(`<md-filled-button>Save</md-filled-button>
<md-outlined-text-field label="Name" value="Matecha"></md-outlined-text-field>
<md-linear-progress wavy value="0.4"></md-linear-progress>
<md-switch selected></md-switch>`)}</pre>
 <div class="note"><md-icon>verified</md-icon><div>JavaScript files from <strong>3.1.0 onward will never be removed</strong>. Version 3.0.0 was removed because of a buffer overflow issue.</div></div>
 <div class="prose"><p>Theming uses the <code>MateCha</code> global, and plain Material tokens keep working.</p></div>
 <pre class="code">${esc(`MateCha.setSeed('#65558F', 'expressive'); // 'tonal' | 'expressive' | 'vibrant'
MateCha.setDark(true);                    // true | false | 'auto'
MateCha.toast('Saved', { action: 'Undo' });

:root { --md-sys-color-primary: #6750a4; }`)}</pre>
 <h2 class="big">Expressive components</h2>
 <div class="grid">${card('toolbars',`<md-toolbar><md-icon-button><md-icon>format_bold</md-icon></md-icon-button><md-icon-button><md-icon>format_italic</md-icon></md-icon-button><md-icon-button><md-icon>format_underlined</md-icon></md-icon-button></md-toolbar>`)}${card('split-button',`<md-split-button>Share</md-split-button>`)}${card('switch-bar',`<md-switch-bar label="Use Live Caption" selected style="width:100%"></md-switch-bar>`)}${card('sliders',`<md-slider size="l" value="60" style="width:100%"><md-icon slot="icon">volume_up</md-icon></md-slider>`)}${card('loading-indicator',`<md-loading-indicator></md-loading-indicator>`)}${card('pull-to-refresh',`<md-circular-progress wavy thick value="0.7"></md-circular-progress>`)}</div>
 <h2 class="big">Browse all components</h2>
 <div class="grid">${C.slice(0,12).map(c=>`<a class="chipcard" href="#/${c[0]}"><div>${c[1]}<small>${c[2]}</small></div></a>`).join('')}</div>
 <p style="margin-top:16px"><md-text-button id="all">See all ${C.length} component pages</md-text-button></p>
 <footer>Matecha 3.5.0 · Apache License 2.0 · API compatibility follows Material Web Components © Google LLC. “Material Design” and “Material Web” are trademarks of Google LLC and are used only to describe compatibility.</footer>`;
}
function pageAll(){
 return `<div class="ph"><h1>Components</h1><p>${C.length} pages covering every built-in Matecha component, from Material Web 2.5.0 and the Expressive additions.</p></div>`+G.map(g=>`<h2 class="big" style="font-size:32px;margin:40px 0 16px">${g}</h2><div class="grid">${C.filter(c=>c[2]===g).map(c=>`<a class="chipcard" href="#/${c[0]}"><div>${c[1]}<small>${c[3].split('.')[0]}</small></div></a>`).join('')}</div>`).join('');
}
function render(){
 const id=cur();
 page.innerHTML=!id||id==='home'?pageHome():id==='components'?pageAll():byId[id]?pageComponent(byId[id]):`<div class="ph"><h1>Not found</h1><p>No component page called “${esc(id)}”. <a href="#/components">Browse all components</a>.</p></div>`;
 const t=byId[id];document.title=(t?t[1]+' — ':'')+'Matecha Expressive Web';
 scrollTo(0,0);mark();
 const gs=$('#gs');if(gs)gs.onclick=()=>document.getElementById('usage').scrollIntoView({behavior:'smooth'});
 const al=$('#all');if(al)al.onclick=()=>location.hash='#/components';
 page.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{const tx=document.getElementById(b.dataset.copy).textContent;navigator.clipboard&&navigator.clipboard.writeText(tx).then(()=>{b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1500)})});
}
addEventListener('hashchange',render);
buildNav();render();

/* theme */
let isDark=true;
const dk=$('#dark');
const sync=()=>{dk.innerHTML=`<md-icon slot="icon">${isDark?'light_mode':'dark_mode'}</md-icon>Switch to ${isDark?'light':'dark'} mode`;document.documentElement.dataset.theme=isDark?'dark':'light'};
dk.onclick=()=>{isDark=!isDark;sync();window.MateCha&&MateCha.setDark(isDark)};
$('#seed').addEventListener('input',e=>window.MateCha&&MateCha.setSeed(e.target.value,'expressive'));
addEventListener('load',()=>{if(window.MateCha)MateCha.setDark(true);else{const w=document.createElement('div');w.className='note';w.innerHTML='<md-icon>warning</md-icon><div>Could not load matecha-3.5.0-all.js. Check your network connection or the CDN.</div>';page.prepend(w)}});
</script>
</body>
</html>
