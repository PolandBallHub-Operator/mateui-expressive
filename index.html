<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matecha Expressive Web — Component Catalog</title>
<style>
:root{--bg:var(--md-sys-color-surface,#fdf8fd);--fg:var(--md-sys-color-on-surface,#1d1b20);--fgv:var(--md-sys-color-on-surface-variant,#49454f);--ol:var(--md-sys-color-outline-variant,#cac4d0);--sc:var(--md-sys-color-surface-container,#f3edf7);--sch:var(--md-sys-color-surface-container-high,#ece6f0);--pr:var(--md-sys-color-primary,#6750a4);--font:var(--md-ref-typeface-plain,Inter,system-ui,sans-serif)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);scroll-behavior:smooth}
body{display:grid;grid-template-columns:268px 1fr;min-height:100vh}
nav.rail{position:sticky;top:0;height:100vh;overflow:auto;padding:20px 12px;border-right:1px solid var(--ol);background:var(--sc)}
nav.rail h1{font-size:18px;font-weight:600;margin:4px 12px 2px}
nav.rail p{font-size:12px;color:var(--fgv);margin:0 12px 14px}
nav.rail a{display:block;padding:9px 14px;margin:2px 0;border-radius:20px;color:var(--fg);text-decoration:none;font-size:14px;transition:border-radius .32s cubic-bezier(.2,0,0,1),background .2s}
nav.rail a:hover{background:var(--sch)}
nav.rail a:active{border-radius:10px}
nav.rail a.on{background:var(--md-sys-color-secondary-container,#e8def8);font-weight:600}
nav.rail small{float:right;color:var(--fgv)}
main{padding:28px clamp(16px,4vw,48px) 96px;min-width:0}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:28px;position:sticky;top:0;z-index:5;padding:12px 0;background:var(--bg)}
.bar md-outlined-text-field{flex:1;min-width:200px}
.bar label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fgv)}
.bar input[type=color]{width:36px;height:36px;border:0;padding:0;background:none;border-radius:50%;cursor:pointer}
.bar select{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--ol);background:var(--bg);color:var(--fg)}
section{margin-bottom:56px;scroll-margin-top:84px}
section>h2{font-size:30px;font-weight:600;margin:0 0 4px}
section>p{margin:0 0 20px;color:var(--fgv);font-size:14px}
.demo{border:1px solid var(--ol);border-radius:24px;margin-bottom:16px;overflow:hidden}
.demo>header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:var(--sc);font-size:14px;font-weight:500}
.demo>header code{font-size:12px;color:var(--fgv);font-weight:400}
.stage{padding:24px 20px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;position:relative}
.stage.col{flex-direction:column;align-items:stretch}
.stage.tall{min-height:260px;align-items:flex-start}
details{border-top:1px solid var(--ol)}
summary{cursor:pointer;padding:10px 20px;font-size:13px;color:var(--fgv)}
pre{margin:0;padding:0 20px 16px;overflow:auto;font-size:12px;line-height:1.55;color:var(--fg);font-family:ui-monospace,Menlo,Consolas,monospace;max-height:320px}
.sw{width:100%}
@media(max-width:820px){body{grid-template-columns:1fr}nav.rail{position:static;height:auto;display:flex;overflow-x:auto;white-space:nowrap;padding:10px}nav.rail h1,nav.rail p{display:none}nav.rail a{flex:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
<script type="module" src="https://cdn.jsdelivr.net/gh/PolandBallHub-Operator/mateui-expressive@main/matecha-3.5.0-all.js"></script>
</head>
<body>
<nav class="rail" id="rail"><h1>Matecha 🧉 Catalog</h1><p>v3.5.0 · Expressive Web</p></nav>
<main>
  <div class="bar">
    <md-outlined-text-field id="q" label="コンポーネントを検索 (例: slider, md-fab)"></md-outlined-text-field>
    <label>シード色 <input type="color" id="seed" value="#6750a4"></label>
    <label>バリアント <select id="variant"><option>tonal</option><option>expressive</option><option>vibrant</option></select></label>
    <md-filled-tonal-button id="dark">ダーク切替</md-filled-tonal-button>
  </div>
  <div id="app"></div>
  <p id="status" style="color:var(--fgv);font-size:13px"></p>
</main>

const app=document.getElementById('app'),rail=document.getElementById('rail'),esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
let total=0;
for(const s of S){
 const a=document.createElement('a');a.href='#'+s.id;a.innerHTML=s.n+'<small>'+s.c.length+'</small>';rail.append(a);
 const sec=document.createElement('section');sec.id=s.id;
 sec.innerHTML='<h2>'+s.n+'</h2><p>'+s.d+'</p>'+s.c.map(c=>{total++;return '<div class="demo" data-k="'+esc((c.t+' '+c.h).toLowerCase()).replace(/"/g,'')+'"><header>'+c.t+'</header><div class="stage '+(c.o?'':(c.cls||''))+'">'+c.h+'</div><details><summary>コードを見る</summary><pre>'+esc(c.h.replace(/ id="(dl|drw|tp)[^"]*"/g,m=>m))+'</pre></details></div>'}).join('');
 app.append(sec);
}
document.getElementById('status').textContent=total+' demos · '+S.length+' categories';
// scroll spy
const links=[...rail.querySelectorAll('a')];
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)links.forEach(l=>l.classList.toggle('on',l.hash==='#'+e.target.id))}),{rootMargin:'-20% 0px -70% 0px'});
document.querySelectorAll('section').forEach(s=>io.observe(s));
// search
document.getElementById('q').addEventListener('input',e=>{const v=e.target.value.trim().toLowerCase();
 document.querySelectorAll('.demo').forEach(d=>d.style.display=!v||d.dataset.k.includes(v)?'':'none');
 document.querySelectorAll('section').forEach(s=>s.style.display=[...s.querySelectorAll('.demo')].some(d=>d.style.display!=='none')?'':'none')});
// theme
const go=()=>window.MateCha&&MateCha.applyTheme({seed:seed.value,variant:variant.value});
seed.addEventListener('input',go);variant.addEventListener('change',go);
