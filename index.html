<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matecha Expressive Web — Components</title>
<style>
:root{--bg:var(--md-sys-color-surface,#141218);--fg:var(--md-sys-color-on-surface,#e6e0e9);--fgv:var(--md-sys-color-on-surface-variant,#cac4d0);--ol:var(--md-sys-color-outline-variant,#49454f);--sc:var(--md-sys-color-surface-container,#211f26);--sch:var(--md-sys-color-surface-container-high,#2b2930);--scl:var(--md-sys-color-surface-container-low,#1d1b20);--pr:var(--md-sys-color-primary,#d0bcff);--onpr:var(--md-sys-color-on-primary,#381e72);--prc:var(--md-sys-color-primary-container,#4f378b);--oprc:var(--md-sys-color-on-primary-container,#eaddff);--sec:var(--md-sys-color-secondary-container,#4a4458);--osec:var(--md-sys-color-on-secondary-container,#e8def8);--font:var(--md-ref-typeface-plain,Inter,system-ui,sans-serif);--dw:304px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);scroll-behavior:smooth}
a{color:var(--pr)}
header.top{position:sticky;top:0;z-index:30;height:64px;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--bg)}
header.top .logo{display:flex;align-items:center;gap:10px;color:var(--fg);text-decoration:none;font-weight:600;font-size:18px;margin-right:auto;padding:6px 8px;border-radius:20px}
header.top .logo span{font-size:26px}
md-navigation-drawer .grp{padding:16px 28px 6px;font-size:13px;color:var(--fgv)}
md-navigation-drawer .filter{margin:4px 16px 8px;width:calc(100% - 32px)}
md-navigation-drawer .opts{display:flex;flex-direction:column;gap:10px;align-items:flex-start;padding:16px 20px 24px}
md-navigation-drawer .opts input[type=color]{width:40px;height:40px;border:0;padding:0;background:none;cursor:pointer;border-radius:50%}
.wrap{min-height:calc(100vh - 64px)}
.page{max-width:1040px;margin:0 auto;padding:16px 16px 96px}
.hero{background:var(--scl);border-radius:36px;padding:clamp(24px,5vw,64px);margin-bottom:16px}
.hero h1{font-size:clamp(44px,11vw,104px);font-weight:400;letter-spacing:-.025em;line-height:1.02;margin:0 0 24px}
.hero p.lead{font-size:clamp(18px,2.6vw,26px);line-height:1.5;color:var(--fgv);max-width:760px;margin:0 0 32px}
.hero md-filled-button{--md-filled-button-container-height:64px;font-size:20px}
.collage{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;border-radius:36px;background:var(--prc);padding:20px;margin-bottom:56px}
.collage>div{background:var(--bg);border-radius:24px;min-height:150px;display:grid;place-items:center;padding:12px;gap:10px;overflow:hidden}
h2.big{font-size:clamp(34px,6vw,56px);font-weight:400;letter-spacing:-.02em;line-height:1.1;margin:56px 0 20px}
.prose p{font-size:17px;line-height:1.7;color:var(--fgv);max-width:760px}
.prose strong{color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{display:block;border-radius:32px;overflow:hidden;background:var(--sec);color:var(--osec);text-decoration:none;transition:border-radius .32s cubic-bezier(.2,0,0,1),transform .2s}
.card:active{border-radius:16px;transform:scale(.99)}
.card .pv{background:var(--oprc);color:var(--prc);min-height:190px;display:grid;place-items:center;padding:16px;pointer-events:none;border-radius:32px 32px 0 0}
.card .tx{padding:20px 24px 24px}
.card h3{margin:0 0 8px;font-size:24px;font-weight:500}
.card p{margin:0;color:var(--osec);opacity:.85;line-height:1.5;font-size:14px}
.chipcard{display:flex;align-items:center;gap:14px;padding:18px 22px;border-radius:24px;background:var(--sc);color:var(--fg);text-decoration:none;font-size:16px;transition:border-radius .32s cubic-bezier(.2,0,0,1),background .2s}
.chipcard:hover{background:var(--sch)}.chipcard:active{border-radius:10px}
.chipcard small{display:block;color:var(--fgv);font-size:12px}
pre.code{margin:0;background:var(--scl);border:1px solid var(--ol);border-radius:20px;padding:18px 20px;overflow:auto;font:13px/1.6 ui-monospace,Menlo,Consolas,monospace;color:var(--fg);position:relative}
.copyrow{position:relative}.copyrow md-filled-tonal-button{position:absolute;top:10px;right:10px}
.note{display:flex;gap:14px;align-items:flex-start;background:var(--sec);color:var(--osec);border-radius:24px;padding:18px 22px;margin:20px 0;line-height:1.55}
.note md-icon{flex:none}
.stats{display:flex;flex-wrap:wrap;gap:12px;margin:8px 0 0}
.stats div{background:var(--sc);border-radius:24px;padding:16px 24px;min-width:140px}
.stats b{display:block;font-size:34px;font-weight:500;color:var(--pr)}
.stats span{font-size:13px;color:var(--fgv)}
.crumb{font-size:14px;color:var(--fgv);margin:8px 8px 0}
.ph{background:var(--scl);border-radius:36px;padding:clamp(24px,5vw,48px);margin:8px 0 16px}
.ph h1{font-size:clamp(40px,9vw,80px);font-weight:400;letter-spacing:-.02em;margin:0 0 12px;line-height:1.05}
.ph p{margin:0;font-size:19px;line-height:1.55;color:var(--fgv);max-width:720px}
.ph code,.api code{font-size:.9em;background:var(--sch);padding:2px 8px;border-radius:8px}
.demo{margin:0 0 20px}
.demo h3{font-size:20px;font-weight:500;margin:28px 8px 12px}
.stage{background:var(--sc);border-radius:28px;padding:32px 24px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center;position:relative}
.stage.col{flex-direction:column;align-items:stretch;justify-content:flex-start}
.stage.tall{min-height:280px;align-items:flex-start}
.demo details{margin-top:8px}
.demo summary{cursor:pointer;padding:8px 12px;font-size:14px;color:var(--fgv)}
.demo pre{margin:6px 0 0;background:var(--scl);border-radius:20px;padding:16px 18px;overflow:auto;max-height:340px;font:12px/1.6 ui-monospace,Menlo,Consolas,monospace;color:var(--fg)}
.api{margin:24px 8px;color:var(--fgv);line-height:1.7;font-size:15px}
.api h3{color:var(--fg);font-size:20px;font-weight:500;margin:0 0 8px}
.sw{width:100%}
.api table{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0 16px}
.api th,.api td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--ol);vertical-align:top}
.api th{color:var(--fg);font-weight:500}
.api pre.code{margin:8px 0 16px;font-size:12.5px}
.api ul{margin:6px 0 16px;padding-left:22px}
.api p{margin:8px 0}
.sws{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;width:100%}
.sws div{border-radius:16px;padding:14px 12px;font-size:12px;min-height:64px}
.mvrow{display:flex;align-items:center;gap:12px;width:100%;font-size:12px;color:var(--fgv)}
.mvrow code{width:150px;flex:none}
.mv{width:40px;height:40px;border-radius:14px;background:var(--pr);transition:transform .7s}
.mv.go{transform:translateX(min(240px,40vw))}
.ok{color:var(--pr)}.no{color:var(--md-sys-color-error,#f2b8b5)}
footer{margin:72px 8px 0;color:var(--fgv);font-size:13px;line-height:1.7}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
<script type="module" src="https://cdn.jsdelivr.net/gh/PolandBallHub-Operator/mateui-expressive@main/matecha-3.8.0_B-all.js"></script>
</head>
<body>
<header class="top">
  <md-icon-button id="menu" aria-label="Menu"><md-icon>menu</md-icon></md-icon-button>

<div class="wrap"><div class="page" id="page"></div></div>

<script>

/* id, name, group, description, demos [title, html, layout], api */
const C=[
['app-bars','App bars','Containment','Top app bars in small, center-aligned, medium and large sizes, with a built-in circled back button.',[
 ['Small and center-aligned',`<md-top-app-bar style="width:100%" headline="Small"><md-icon-button slot="leading"><md-icon>menu</md-icon></md-icon-button></md-top-app-bar><md-top-app-bar style="width:100%" type="center-aligned" headline="Center"></md-top-app-bar>`,'col'],
 ['Medium',`<md-top-app-bar style="width:100%" type="medium" headline="Medium"></md-top-app-bar><md-top-app-bar style="width:100%" type="large" headline="Large"></md-top-app-bar>`,'col'],
 ['Back button and circle leading (3.5.0)',`<md-top-app-bar style="width:100%" headline="Settings" back></md-top-app-bar><md-top-app-bar style="width:100%" headline="Profile" circle-leading><md-icon-button slot="leading"><md-icon>menu</md-icon></md-icon-button></md-top-app-bar>`,'col'],
 ['Search, subtitle, centered (3.7.0)',`<md-top-app-bar style="width:100%" type="search" search-placeholder="Search mail"><md-icon-button slot="leading"><md-icon>menu</md-icon></md-icon-button></md-top-app-bar><md-top-app-bar style="width:100%" headline="Inbox" subtitle="12 unread"></md-top-app-bar><md-top-app-bar style="width:100%" type="large" centered headline="Large centered"></md-top-app-bar>`,'col']],
 '<code>type</code>: small · center-aligned · medium · large · search. <code>subtitle</code>, <code>centered</code> and <code>search-placeholder</code> are new in 3.7.0. <code>back</code>, <code>back-label</code> (default “Back”) and <code>circle-leading</code> were added in 3.5.0. The <code>back</code> event bubbles, is composed and is cancelable. Tokens: <code>--md-top-app-bar-leading-size</code>, <code>-leading-container-color</code>, <code>-leading-icon-color</code>.'],
['avatars','Avatars','Containment','Avatars with initials or icons and four tones.',[['Tones',`<md-avatar>AB</md-avatar><md-avatar tone="lavender">CD</md-avatar><md-avatar tone="pink">EF</md-avatar><md-avatar tone="soft"><md-icon>person</md-icon></md-avatar>`]],'<code>tone</code>: purple (default) · lavender · pink · soft. <code>src</code> and <code>alt</code> show an image.'],

 ['Types',btn('Elevated','elevated')+btn('Filled')+btn('Tonal','filled-tonal')+btn('Outlined','outlined')+btn('Text','text')],

 ['shape="square"',`<md-filled-button shape="square">Square</md-filled-button><md-filled-tonal-button shape="square">Square</md-filled-tonal-button><md-outlined-button shape="square">Square</md-outlined-button>`],
 ['block (3.5.0)',`<md-filled-button block style="width:100%">Full width</md-filled-button><md-outlined-button block style="width:100%">Full width</md-outlined-button>`,'col'],
 ['Sizes xs to xl (3.7.0)',`<md-filled-button size="xs">XS</md-filled-button><md-filled-button size="s">S</md-filled-button><md-filled-button size="m">M</md-filled-button><md-filled-button size="l">L</md-filled-button><md-filled-button size="xl">XL</md-filled-button>`]],

 '<code>size</code> works on split buttons too (3.7.0).'],

  ['variant="outlined" (3.8.0)',`<md-segmented-button-set variant="outlined"><md-segmented-button selected label="Day"></md-segmented-button><md-segmented-button label="Week"></md-segmented-button><md-segmented-button label="Month"></md-segmented-button></md-segmented-button-set><md-segmented-button-set variant="outlined" multiselect><md-segmented-button selected label="Bold"></md-segmented-button><md-segmented-button selected label="Italic"></md-segmented-button><md-segmented-button label="Underline"></md-segmented-button></md-segmented-button-set>`]],

['icon-buttons','Icon buttons','Actions','Standard, filled, tonal and outlined icon buttons, plus toggle.',[['Variants',`<md-icon-button><md-icon>favorite</md-icon></md-icon-button><md-filled-icon-button><md-icon>favorite</md-icon></md-filled-icon-button><md-filled-tonal-icon-button><md-icon>favorite</md-icon></md-filled-tonal-icon-button><md-outlined-icon-button><md-icon>favorite</md-icon></md-outlined-icon-button><md-icon-button toggle><md-icon>star</md-icon><md-icon slot="selected">star</md-icon></md-icon-button>`],['Sizes xs to xl (3.7.0)',`<md-filled-tonal-icon-button size="xs"><md-icon>favorite</md-icon></md-filled-tonal-icon-button><md-filled-tonal-icon-button size="s"><md-icon>favorite</md-icon></md-filled-tonal-icon-button><md-filled-tonal-icon-button size="m"><md-icon>favorite</md-icon></md-filled-tonal-icon-button><md-filled-tonal-icon-button size="l"><md-icon>favorite</md-icon></md-filled-tonal-icon-button><md-filled-tonal-icon-button size="xl"><md-icon>favorite</md-icon></md-filled-tonal-icon-button>`]]],

 '<code>size</code>: small · medium (default) · large. Add <code>label</code> for an extended FAB.'],
['fab-menu','FAB menu','Actions','A FAB that expands into staggered action pills.',[['FAB menu',`<md-fab-menu><md-fab-menu-item label="Photo"><md-icon slot="icon">image</md-icon></md-fab-menu-item><md-fab-menu-item label="Note"><md-icon slot="icon">note</md-icon></md-fab-menu-item></md-fab-menu>`,'tall']]],
['fab-toolbar','FAB toolbar','Actions','A FAB that expands into a toolbar of actions, upwards or sideways. New in 3.8.0.',[

 '<code>variant</code>: vibrant (default) · tonal · filled. <code>horizontal</code> opens the toolbar to the side instead of upwards. <code>expanded</code> opens it; <code>auto-close</code> closes it again after an action is chosen. Slots: <code>fab</code> (the FAB) and the default slot (actions). Methods: <code>toggle()</code>, <code>show()</code>, <code>close()</code>. Events: cancelable <code>toggle</code> with <code>detail.expanded</code>, and <code>expanded-change</code>. A click on the FAB toggles it, and Escape or a press outside closes it. Tokens: <code>--md-fab-toolbar-container-color</code>, <code>--md-fab-toolbar-icon-color</code>.'],

['date-picker','Date picker','Selection','Pick a date from a calendar or type it in. Localised through Intl, with min and max. New in 3.8.0.',[

 ['Wheel',`<md-time-picker inline mode="wheel" format="24" value="18:20"></md-time-picker>`]],

['top-popup','Top popup','Communication','A card that slides down from the top edge. Swipe up to dismiss. New in 3.5.0.',[['Top popup',`<md-filled-tonal-button onclick="tp.show()">Show top popup</md-filled-tonal-button><md-top-popup id="tp" duration="5000"><md-icon slot="icon">fullscreen</md-icon><div slot="headline">Viewing full screen</div>Swipe up to exit.<div slot="actions"><md-text-button dialog-action="ok">Got it</md-text-button></div></md-top-popup>`]],

['theming','Theming','Guides','Dynamic colour from any seed, three schemes, dark mode and Material Theme Builder compatibility, all through the MateCha global.',[
 ['Seed, scheme and dark mode',`<label style="display:flex;align-items:center;gap:10px">Seed <input type="color" value="#6750a4" oninput="MateCha.setSeed(this.value)" style="width:44px;height:44px;border:0;padding:0;background:none;cursor:pointer"></label><md-filled-tonal-button onclick="MateCha.setVariant('tonal')">tonal</md-filled-tonal-button><md-filled-tonal-button onclick="MateCha.setVariant('expressive')">expressive</md-filled-tonal-button><md-filled-tonal-button onclick="MateCha.setVariant('vibrant')">vibrant</md-filled-tonal-button><md-outlined-button onclick="MateCha.setDark(true)">Dark</md-outlined-button><md-outlined-button onclick="MateCha.setDark(false)">Light</md-outlined-button><md-outlined-button onclick="MateCha.setDark('auto')">Auto</md-outlined-button><md-text-button onclick="MateCha.resetTheme()">Reset</md-text-button>`],
 ['Colour roles',`<div class="sws"><div style="background:var(--md-sys-color-primary);color:var(--md-sys-color-on-primary)">primary</div><div style="background:var(--md-sys-color-primary-container);color:var(--md-sys-color-on-primary-container)">primary-container</div><div style="background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container)">secondary-container</div><div style="background:var(--md-sys-color-tertiary-container);color:var(--md-sys-color-on-tertiary-container)">tertiary-container</div><div style="background:var(--md-sys-color-surface-container-high);color:var(--md-sys-color-on-surface)">surface-container-high</div><div style="background:var(--md-sys-color-error-container);color:var(--md-sys-color-on-error-container)">error-container</div></div>`,'col'],
 ['Live state',`<pre class="code" id="ths" style="width:100%"></pre>`,'col']],
 `<p>Tokens are injected once as <code>&lt;style id="matecha-tokens"&gt;</code> at the start of the head, using <code>:where()</code>, so any page rule, Material Theme Builder output or inline <code>:root</code> rule wins. Components read <code>--md-sys-color-*</code> only. Dark values apply with <code>prefers-color-scheme: dark</code>, <code>[data-theme="dark"]</code>, or <code>[data-theme="light"]</code> to force light.</p>
 <table><tr><th>Member</th><th>Meaning</th></tr>
 <tr><td><code>version</code>, <code>state</code></td><td>Version string; read-only <code>{ seed, variant, dark, custom }</code>.</td></tr>
 <tr><td><code>applyTheme({ seed, variant, dark })</code></td><td>Sets <code>data-theme</code> and <code>data-variant</code> on html, writes <code>--mate-*</code> and derived <code>--md-sys-color-*</code> inline.</td></tr>
 <tr><td><code>setSeed(hex, variant?)</code>, <code>setVariant(v)</code></td><td>Variant is tonal, expressive or vibrant.</td></tr>
 <tr><td><code>setDark(true | false | 'auto')</code>, <code>toggleDark()</code></td><td>Force or follow the system.</td></tr>
 <tr><td><code>resetTheme()</code></td><td>Removes inline tokens and the data attributes.</td></tr>
 <tr><td><code>schemeFromSeed(hex, isDark, variant?)</code></td><td>Returns <code>{ hct, effectiveChroma, tokens, sys }</code> without applying it.</td></tr>
 <tr><td><code>toast(message, { action, duration, closeButton })</code></td><td>Promise of action, dismiss, timeout or replaced.</td></tr>
 <tr><td><code>hctToHex</code>, <code>rgbToHct</code>, <code>hexToRgb</code>, <code>rgbToHex</code></td><td>Colour helpers.</td></tr></table>
 <p>Event: <code>mate-theme-change</code> bubbles on html with <code>detail: { seed, variant, dark }</code>. Plain Material tokens keep working: <code>:root { --md-sys-color-primary: #6750a4; }</code>.</p>`],
['design-language','Design language','Guides','Motion tokens, press morphing and the reference metrics that every Matecha component follows.',[
 ['Motion tokens',`<div class="mvrow" style="justify-content:space-between"><span>Press Play to compare the four easing curves</span><md-filled-tonal-button onclick="this.closest('.stage').querySelectorAll('.mv').forEach(e=>e.classList.toggle('go'))">Play</md-filled-tonal-button></div><div class="mvrow"><code>--mate-spring-fast</code><div class="mv" style="transition-timing-function:cubic-bezier(.34,1.56,.64,1)"></div></div><div class="mvrow"><code>--mate-spring-spatial</code><div class="mv" style="transition-timing-function:cubic-bezier(.28,1.35,.48,1)"></div></div><div class="mvrow"><code>--mate-ease-decel</code><div class="mv" style="transition-timing-function:cubic-bezier(.05,.7,.1,1)"></div></div><div class="mvrow"><code>--mate-ease-accel</code><div class="mv" style="transition-timing-function:cubic-bezier(.3,0,.8,.15)"></div></div>`,'col'],
 ['Shape morph on press',`<md-filled-button>Press and hold</md-filled-button><md-filled-tonal-button>Press and hold</md-filled-tonal-button><md-toggle-button>Toggle</md-toggle-button><md-filter-chip label="Chip"></md-filter-chip><md-icon-button><md-icon>favorite</md-icon></md-icon-button>`]],
 `<p>Buttons, icon buttons, FABs, chips, list items and navigation pills swap their border radius while the pointer or keyboard is held (class <code>hold</code>, released after 70 ms). Typical: pill 20 px to 12 px, selected 12 px to 20 px, with a radius transition of <code>.32s cubic-bezier(.2, 0, 0, 1)</code>. Menus, dialogs, tooltips and snackbars scale and translate in with <code>--mate-spring-fast</code> over .3 to .38 s.</p>
 <table><tr><th>Token</th><th>Value</th></tr><tr><td><code>--mate-spring-fast</code></td><td>cubic-bezier(.34, 1.56, .64, 1)</td></tr><tr><td><code>--mate-spring-spatial</code></td><td>cubic-bezier(.28, 1.35, .48, 1)</td></tr><tr><td><code>--mate-ease-decel</code></td><td>cubic-bezier(.05, .7, .1, 1)</td></tr><tr><td><code>--mate-ease-accel</code></td><td>cubic-bezier(.3, 0, .8, .15)</td></tr></table>
 <table><tr><th>Component</th><th>Reference metrics</th></tr>
 <tr><td>Button</td><td>40 px high, 14 px / 500, radius 20 to 12 pressed</td></tr>
 <tr><td>Chip</td><td>32 px high, radius 8 to 16 pressed, 1 px outline-variant; selected uses secondary-container</td></tr>
 <tr><td>Switch</td><td>52×32 pill, spring thumb</td></tr>
 <tr><td>Slider</td><td>Thick track, detached vertical pill handle</td></tr>
 <tr><td>Progress</td><td>Strokes 3.5 and 6.5; wavy amplitude about 2.4 to 2.6 (linear) and 2.1 to 2.2 (circular)</td></tr>
 <tr><td>Navigation pill</td><td>64×32 (horizontal: auto×40); shrinks to 54 px on press</td></tr>
 <tr><td>Menu</td><td>Radius 20, 8 px padding, item radius 12, spring scale-in from the anchor corner</td></tr>
 <tr><td>Dialog</td><td>Radius 28, 24 px padding, headline 22 px / 500, scrim 52 %</td></tr>
 <tr><td>Outlined field</td><td>1 px outline, radius 6, notched label, 2 px primary on focus</td></tr></table>
 <p><code>prefers-reduced-motion: reduce</code> disables transitions and animations where practical and stops the wavy animation.</p>`],
['forms','Forms and behaviour','Guides','Form-associated elements, keyboard navigation, overlays and accessibility.',[
 ['Form association',`<form style="display:flex;flex-direction:column;gap:16px;width:100%" onsubmit="event.preventDefault();document.getElementById('fout').textContent=JSON.stringify(Object.fromEntries(new FormData(this)),null,2)"><md-filled-text-field name="name" label="Name" required></md-filled-text-field><md-outlined-select name="fruit" label="Fruit"><md-select-option value="apple" selected><div slot="headline">Apple</div></md-select-option><md-select-option value="banana"><div slot="headline">Banana</div></md-select-option></md-outlined-select><label><md-checkbox name="agree" value="yes"></md-checkbox> I agree</label><label><md-switch name="news" value="on"></md-switch> Newsletter</label><md-slider name="volume" value="30"></md-slider><div style="display:flex;gap:12px"><md-filled-button type="submit">Submit</md-filled-button><md-outlined-button type="reset">Reset</md-outlined-button></div><pre class="code" id="fout">Submit to see the form data</pre></form>`,'col']],
 `<p><strong>Forms.</strong> Form-associated elements implement <code>form</code>, <code>labels</code>, <code>validity</code>, <code>validationMessage</code>, <code>willValidate</code>, <code>checkValidity()</code>, <code>reportValidity()</code>, <code>setCustomValidity()</code>, <code>formResetCallback</code>, <code>formStateRestoreCallback</code> and <code>formDisabledCallback</code>.</p>
 <p><strong>Reactivity.</strong> Properties and attributes are mirrored and updates are batched in a microtask. Properties assigned before an element upgrades are applied on upgrade.</p>
 <p><strong>Focus.</strong> Interactive elements use <code>delegatesFocus</code> where Material Web does. <code>md-focus-ring</code> is visible for keyboard modality only.</p>
 <p><strong>Overlays.</strong> <code>md-menu</code> and <code>md-tooltip</code> use the Popover API (top layer) when available and <code>position: fixed</code> otherwise; they reposition on scroll and resize and flip vertically when space is short. <code>md-dialog</code> uses the native dialog element in modal mode.</p>
 <p><strong>Keyboard.</strong> Arrow, Home and End navigate tabs, lists, menus, chip sets, the navigation bar and toolbars. Escape closes menus, dialogs, drawers and tooltips. Menus and selects support type-ahead.</p>
 <p><strong>Accessibility.</strong> Native roles (tablist, menu, listbox, dialog or alertdialog, progressbar, toolbar and more) and aria attributes are set on the inner interactive element, and host aria attributes are forwarded.</p>`],
['migration','Migration and configuration','Guides','Swap the import, keep your markup. Packaging, compatibility contract and configuration.',[],
 `<p><strong>Swap the import.</strong> A page that works with Material Web 2.5.0 keeps working without markup changes.</p>
 <pre class="code">&lt;!-- before --&gt;
&lt;script type="module" src="https://cdn.jsdelivr.net/npm/@material/web/all.js"&gt;&lt;/script&gt;
&lt;!-- after --&gt;
&lt;script type="module" src="${URL_JS}"&gt;&lt;/script&gt;</pre>
 <p><strong>Compatibility contract.</strong> For every Material Web 2.5.0 element Matecha preserves:</p>
 <ul><li>the tag name;</li><li>attributes and properties (names, types, defaults, reflection) including aria forwarding;</li><li>public methods such as <code>focus()</code>, <code>show()</code>, <code>close()</code>, <code>select()</code> and <code>reportValidity()</code>;</li><li>events (<code>input</code>, <code>change</code>, <code>open</code>, <code>opened</code>, <code>close</code>, <code>closed</code>, <code>cancel</code>, <code>remove</code>, <code>close-menu</code>) with the same bubbling, composition and cancelability;</li><li>slots and part names;</li><li>form association;</li><li>the <code>--md-component-*</code> and <code>--md-sys-*</code> custom properties.</li></ul>
 <p>Shadow DOM internals differ by design, so rely on documented parts and tokens rather than private structure.</p>
 <p><strong>Packaging.</strong></p>
 <table><tr><th>File</th><th>Content</th></tr>
 <tr><td><code>matecha-3.8.0_B-all.js</code></td><td>Complete bundle (ES module, side-effect import)</td></tr>
 <tr><td><code>matecha-3_8_0-all_part1.js</code></td><td>Core (tokens, MateElement), primitives, buttons, selection controls, slider</td></tr>
 <tr><td><code>matecha-3_8_0-all_part2.js</code></td><td>Progress, chips, tabs, list, fields, menus, dialog, Expressive additions and the MateCha global</td></tr>
 <tr><td><code>matecha-3_8_0-all_part3.js</code></td><td>3.5.0 – 3.6.0 additions: switch bar, top popup, pull to refresh, search view, navigation rail</td></tr>
 <tr><td><code>matecha-3_8_0-all_part4.js</code></td><td>3.7.0 additions: toggle button, bottom app bar, bottom sheet, carousel, text field group</td></tr>
 <tr><td><code>matecha-3_8_0-all_part5.js</code></td><td>3.8.0 additions: FAB toolbar, toolbar FAB, time picker, date picker</td></tr></table>
 <p>Loading the module registers every element with <code>customElements.define</code>, skipping names that are already defined, and defines <code>window.MateCha</code> and <code>window.MateChaComponents</code>. The bundle has no exports.</p>
 <p><strong>Configuration.</strong> Set this before loading the script to skip the Material Symbols Rounded and Inter font links:</p>
 <pre class="code">window.MATECHA_NO_FONTS = true;</pre>
 <p>Icon font token: <code>--md-icon-font</code> (default "Material Symbols Rounded"). Typeface tokens: <code>--md-ref-typeface-plain</code> and <code>--md-ref-typeface-brand</code>.</p>
 <p><strong>Browser support.</strong> Evergreen browsers with Custom Elements, Shadow DOM, ElementInternals, adoptedStyleSheets and CSS color-mix(): Chrome and Edge 111+, Safari 16.4+, Firefox 113+.</p>
 <p><strong>Licence.</strong> Apache License 2.0. The public API follows Material Web Components &copy; Google LLC (Apache-2.0); no Material Web source code is included.</p>`],

function pageHome(){
 return `<section class="hero"><h1>Matecha</h1><p class="lead">Matecha is a from-scratch, drop-in replacement for Google’s Material Web Components. It brings Jetpack Compose Material 3 and Material 3 Expressive to the web as plain Web Components.</p><md-filled-button id="gs">Get started</md-filled-button></section>
 <div class="collage" aria-hidden="true"><div><md-toolbar><md-icon-button><md-icon>format_bold</md-icon></md-icon-button><md-icon-button><md-icon>format_italic</md-icon></md-icon-button></md-toolbar></div><div><md-switch-bar label="Live Caption" selected></md-switch-bar></div><div><md-loading-indicator></md-loading-indicator><md-linear-progress wavy thick value="0.6" style="width:100%"></md-linear-progress></div><div><md-fab label="Compose"><md-icon slot="icon">edit</md-icon></md-fab></div><div><md-connected-button-group><md-connected-button selected>Day</md-connected-button><md-connected-button>Week</md-connected-button></md-connected-button-group></div></div>
 <h2 class="big">What is Matecha?</h2>
 <div class="prose"><p><strong>Matecha</strong> (component name <strong>MateCha</strong>) is an independent implementation that is API-compatible with Material Web Components v2.5.0: the same tag names, attributes, properties, methods, events, slots, parts and <code>--md-sys-*</code> design tokens.</p><p>It was written from scratch as dependency-free Web Components, with no Lit, no tslib and no Google source code. Visuals and motion follow Material 3 Expressive: spring motion, shape morphing on press, wavy progress and a detached-handle slider.</p><p>If your site already uses <code>@material/web</code>, swap the import and your markup keeps working. Matecha is not an official Google product and is not affiliated with Google LLC.</p></div>
 <div class="stats"><div><b>44</b><span>Material Web elements</span></div><div><b>25+</b><span>Expressive additions</span></div><div><b>0</b><span>Dependencies</span></div><div><b>3.8.0</b><span>Latest version</span></div></div>
 <h2 class="big" id="usage">Usage</h2>
 <div class="prose"><p>Add one script tag. Loading the module registers every element and defines <code>window.MateCha</code>.</p></div>
 <div class="copyrow"><pre class="code" id="u1">${esc(`<script type="module" src="${URL_JS}"><\/script>`)}</pre><md-filled-tonal-button data-copy="u1">Copy</md-filled-tonal-button></div>

 <pre class="code">${esc(`MateCha.setSeed('#65558F', 'expressive'); // 'tonal' | 'expressive' | 'vibrant'
MateCha.setDark(true);                    // true | false | 'auto'
MateCha.toast('Saved', { action: 'Undo' });

:root { --md-sys-color-primary: #6750a4; }`)}</pre>
 <h2 class="big">Guides</h2>
