<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Material Expressive Studio</title>
<script type="module" src="https://cdn.jsdelivr.net/gh/PolandBallHub-Operator/mateui-expressive@main/matecha-3.7.0-all.js"></script>
<style>
:root{color-scheme:light;--bg:var(--md-sys-color-surface,#fef7ff);--fg:var(--md-sys-color-on-surface,#1d1b20);--ol:var(--md-sys-color-outline-variant,#cac4d0);--pn:var(--md-sys-color-surface-container,#f3edf7);--pr:var(--md-sys-color-primary,#6750a4);--pc:var(--md-sys-color-primary-container,#eaddff)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark}}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--fg)}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{display:grid;grid-template-rows:60px 1fr;height:100%}
header{display:flex;align-items:center;gap:6px;padding:0 12px;background:var(--pn);border-bottom:1px solid var(--ol);overflow-x:auto}
header h1{font-size:18px;font-weight:600;margin:0 12px 0 4px;white-space:nowrap}
header .sp{flex:1}
main{display:grid;grid-template-columns:240px 1fr 290px;min-height:0}
aside{background:var(--pn);overflow:auto;min-height:0}
.L{border-right:1px solid var(--ol);display:grid;grid-template-rows:auto 1fr}
.R{border-left:1px solid var(--ol);padding:12px;display:flex;flex-direction:column;gap:12px}
h3{margin:0;font-size:12px;font-weight:600;letter-spacing:.02em;opacity:.7;padding:10px 12px 4px}
.R h3{padding:0}
.pal{max-height:300px;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px 10px 10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:14px;background:var(--bg);font-size:12px;cursor:grab;user-select:none;border:1px solid var(--ol)}
.tile:hover{background:var(--pc)}
.ti{display:flex;align-items:center;gap:8px;padding:6px 12px;font-size:13px;cursor:pointer;border-radius:12px;margin:0 6px}
.ti.sel{background:var(--pc)}.ti small{opacity:.6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.C{display:grid;grid-template-rows:auto 1fr;min-width:0;min-height:0;background:color-mix(in srgb,var(--fg) 8%,var(--bg))}
.acts{display:flex;align-items:center;gap:4px;padding:6px 10px;background:var(--bg);border-bottom:1px solid var(--ol);overflow-x:auto}
.at{padding:8px 14px;border-radius:999px;font-size:13px;cursor:pointer;white-space:nowrap}.at.on{background:var(--pc);font-weight:600}
.stage{overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:24px;min-height:0}
.frame{transform-origin:top left;background:var(--bg);border-radius:22px;box-shadow:0 0 0 8px #222,0 12px 40px #0006;overflow:auto;position:relative}
.frame.run{overflow:hidden}.frame iframe{border:0;width:100%;height:100%;display:block}
textarea.code{width:100%;height:100%;font:12px/1.5 ui-monospace,monospace;background:var(--bg);color:var(--fg);border:0;padding:16px;resize:none}
.sel-n{outline:2px solid var(--pr);outline-offset:2px;border-radius:4px}
.drop-b{box-shadow:0 -3px 0 var(--pr)}.drop-a{box-shadow:0 3px 0 var(--pr)}
.edit .w>*{pointer-events:none}.edit .w{cursor:pointer;pointer-events:auto}.edit [data-abs]{background-image:linear-gradient(var(--ol) 1px,transparent 1px),linear-gradient(90deg,var(--ol) 1px,transparent 1px);background-size:20px 20px}.edit [data-abs]>.w{touch-action:none;cursor:move}.rz{position:absolute;right:-4px;bottom:-4px;width:16px!important;height:16px!important;border-radius:50%;background:var(--pr);cursor:nwse-resize;pointer-events:auto!important;z-index:5}.edit .w.ov{position:static}.edit [data-c]{min-height:44px;outline:1px dashed var(--ol);outline-offset:-1px;border-radius:8px}.ovp{border:2px dashed var(--pr);border-radius:20px;padding:12px;background:var(--pn);font-size:13px}.drop-l{box-shadow:-3px 0 0 var(--pr)}.drop-r{box-shadow:3px 0 0 var(--pr)}.edit .tn,.edit .tn *{pointer-events:auto;cursor:pointer}.drop-i{outline:3px solid var(--pr)!important}#mtb{display:grid;grid-template-columns:230px 1fr;gap:16px;min-height:60vh}.mtl{display:flex;flex-direction:column;gap:6px}.pb{padding:8px 10px;border-radius:10px;cursor:pointer;font-size:13px;color:#fff;background:var(--c,#888)}.blk{border-radius:10px;padding:6px;margin:4px 0;background:var(--c,#888);color:#fff;font-size:13px}.br{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.slot{margin:4px 0 4px 14px;padding:4px;border-radius:8px;background:#0003;min-height:28px;border:2px dashed transparent}.slot.on{border-color:#fff}.slot small{opacity:.7}.bi{font:inherit;padding:3px 6px;border-radius:6px;border:0;max-width:150px}.bx{margin-left:auto;display:flex;gap:8px}.bx i,.sh i,.vr i{cursor:pointer;font-style:normal;font-size:11px;opacity:.85}.sc{border:1px solid var(--ol);border-radius:16px;padding:10px;margin-bottom:12px}.sh{display:flex;gap:8px;align-items:center;margin-bottom:6px}.vr{display:flex;gap:6px;align-items:center;font-size:13px}.vr .bi{width:70px;background:var(--pn);color:var(--fg)}.sh .bi{background:var(--pn);color:var(--fg)}[data-cat=v]{--c:#43a047}[data-cat=m]{--c:#7e57c2}[data-cat=c]{--c:#fb8c00}[data-cat=u]{--c:#1e88e5}
.row{display:flex;gap:6px;flex-wrap:wrap}
.R md-outlined-text-field,.R md-outlined-select{width:100%}
input[type=color]{width:34px;height:34px;border:0;padding:0;background:none;cursor:pointer}
@media(max-width:900px){main{grid-template-columns:1fr}aside{display:none}}
/* generated-screen CSS (shared with export) */
APPCSS_PLACEHOLDER
</style>
</head>
<body>
<header>
  <md-icon>deployed_code</md-icon>
  <h1>Material Expressive Studio</h1>
  <md-filled-tonal-button id="m-design">Design</md-filled-tonal-button>
  <md-text-button id="m-run">Run</md-text-button>
  <md-text-button id="m-code">Code</md-text-button>
  <span class="sp"></span>
  <md-outlined-select id="dev" label="Device" style="min-width:210px"></md-outlined-select>
  <md-icon-button id="rot" title="回転"><md-icon>screen_rotation</md-icon></md-icon-button>
  <input type="color" id="seed" value="#6750a4" title="Seed color">
  <md-icon-button id="dk" title="Dark"><md-icon>dark_mode</md-icon></md-icon-button>
  <md-filled-tonal-button id="mtbtn"><md-icon slot="icon">extension</md-icon>Materatch</md-filled-tonal-button>
  <md-icon-button id="imp" title="Import"><md-icon>upload_file</md-icon></md-icon-button>
  <md-text-button id="cp"><md-icon slot="icon">content_copy</md-icon>Copy</md-text-button>
  <md-filled-button id="ex"><md-icon slot="icon">download</md-icon>Export HTML</md-filled-button>
  <input type="file" id="file" accept=".html" hidden>
</header>
<main>
  <aside class="L"><div><h3>Palette</h3><label style="display:flex;align-items:center;justify-content:space-between;padding:0 12px 4px;font-size:12px">選択中の部品と同じ行に追加<md-switch id="same"></md-switch></label><div class="pal" id="pal"></div></div><div><h3>Component Tree</h3><div id="tree"></div></div></aside>
  <section class="C"><div class="acts" id="acts"></div><div class="stage" id="stage"></div></section>
  <aside class="R" id="props"></aside>
</main>
<md-dialog id="mt" fullscreen><div slot="headline">Materatch — ブロックでアクションを組む</div><div slot="content" id="mtb"></div><div slot="actions"><md-filled-button dialog-action="close">閉じる</md-filled-button></div></md-dialog>

const slotH=(key,l)=>`<div class="slot${mt.slot==key?' on':''}" data-slot="${key}">${l.map(bH).join('')||'<small>ここに追加 (クリックで選択)</small>'}</div>`;
function bH(b){const d=BS[b.t],a=b.a||{};return`<div class="blk" data-cat="${CAT[b.t]}" data-b="${b.id}"><div class="br">${d.l.map(p=>typeof p=='string'?`<span>${p}</span>`:p[1]=='t'?`<input class="bi" data-f="${p[0]}" value="${esc(a[p[0]]??'')}" placeholder="${esc(p[2]||'')}">`:sel2(optsOf(p[1]),a[p[0]],`data-f="${p[0]}"`)).join('')}<span class="bx"><i data-bd="up">▲</i><i data-bd="dn">▼</i><i data-bd="del">✕</i></span></div>${d.c?slotH(b.id+':c',b.c||[]):''}${d.e?'<div class="br"><span>でなければ</span></div>'+slotH(b.id+':e',b.e||[]):''}</div>`}
function mtRender(){$('#mtb').innerHTML=`<div class="mtl"><h3>全体変数</h3>${P.vars.map((v,i)=>`<div class="vr"><b>${esc(v.name)}</b>初期<input class="bi" data-vi="${i}" value="${esc(v.init)}"><i data-vd="${i}">✕</i></div>`).join('')}<div class="vr"><input class="bi" id="nv" placeholder="変数名" style="width:90px"><md-text-button id="addv">追加</md-text-button></div><h3>ブロック (クリックで選択中の枠へ追加)</h3>${Object.entries(BS).map(([k,d])=>`<div class="pb" data-cat="${CAT[k]}" data-ba="${k}">${d.nm}</div>`).join('')}<div style="font-size:11px;opacity:.7">文字欄で {変数名} で変数、{@部品id} で入力欄の値を使えます</div></div><div>${P.scripts.map(s=>`<div class="sc"><div class="sh">${sel2(KS,s.k,`data-sk="${s.id}"`)}${s.k=='start'?'':sel2(s.k=='enter'?optsOf('a'):nl(),s.n,`data-sn="${s.id}"`)}<i data-sd="${s.id}">スクリプト削除</i></div>${slotH(s.id+':root',s.b)}</div>`).join('')}<md-filled-tonal-button id="adds"><md-icon slot="icon">add</md-icon>スクリプトを追加</md-filled-tonal-button></div>`}
function ins2(t){if(!P.scripts.length)P.scripts.push({id:'s'+P.seq++,k:'click',n:(nl()[0]||[''])[0],b:[]});let l=mt.slot&&slotList(mt.slot);if(!l){mt.slot=P.scripts[0].id+':root';l=P.scripts[0].b}const d=BS[t],a={};d.l.forEach(p=>{if(typeof p!='string'&&p[1]!='t')a[p[0]]=(optsOf(p[1])[0]||[''])[0]});const b={id:'b'+P.seq++,t,a};if(d.c)b.c=[];if(d.e)b.e=[];l.push(b)}
$('#mtbtn').onclick=()=>{mtRender();$('#mt').show()};
$('#mtb').addEventListener('click',e=>{const g=s=>e.target.closest(s);let r=1;
 if(g('[data-ba]'))ins2(g('[data-ba]').dataset.ba);
 else if(g('[data-bd]')){const b=bl(g('[data-b]').dataset.b),d=g('[data-bd]').dataset.bd;if(d=='del')b.l.splice(b.i,1);else{const j=b.i+(d=='up'?-1:1);if(j>=0&&j<b.l.length)[b.l[b.i],b.l[j]]=[b.l[j],b.l[b.i]]}}
 else if(g('[data-vd]'))P.vars.splice(+g('[data-vd]').dataset.vd,1);
 else if(g('#addv')){const v=$('#nv').value.trim();if(v&&!P.vars.some(x=>x.name==v))P.vars.push({name:v,init:'0'})}
 else if(g('#adds'))P.scripts.push({id:'s'+P.seq++,k:'click',n:(nl()[0]||[''])[0],b:[]});
 else if(g('[data-sd]'))P.scripts=P.scripts.filter(s=>s.id!=g('[data-sd]').dataset.sd);
 else if(g('[data-slot]')&&!g('input,select'))mt.slot=g('[data-slot]').dataset.slot;else r=0;
 if(r)mtRender()});
$('#mtb').addEventListener('input',e=>{const t=e.target,d=t.dataset;if(d.f)bl(t.closest('[data-b]').dataset.b).b.a[d.f]=t.value;else if(d.vi!=null)P.vars[+d.vi].init=t.value});
$('#mtb').addEventListener('change',e=>{const t=e.target,d=t.dataset;if(d.sk){const s=P.scripts.find(x=>x.id==d.sk);s.k=t.value;s.n=t.value=='start'?'':((t.value=='enter'?optsOf('a'):nl())[0]||[''])[0];mtRender()}else if(d.sn)P.scripts.find(x=>x.id==d.sn).n=t.value});
$('#stage').addEventListener('click',e=>{const t=e.target.closest('[data-tab]');if(!t||mode!='design')return;e.stopPropagation();const[h,p]=t.dataset.tab.split(':'),H=loc(h)?.n;if(H){H.cur=H.kids.findIndex(x=>x.id==p);sel=p;all()}},true);
all();
</script>
</body>
</html>
